<style>
/* composants propres à la section Histoire, dans les codes de l'appli (laque rouge, or, parchemin) */
html{background:#b9a8dc}
body.hist{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.hwrap{max-width:760px;margin:0 auto;display:grid;gap:14px;padding-top:6px}
.hsearch{width:100%;padding:12px 16px;border:2px solid #c49a3a;border-radius:999px;background:linear-gradient(#fffaf2,#fbe7dd);color:#181225;font:500 1rem "Zen Kaku Gothic New",sans-serif;box-shadow:0 2px 8px rgba(35,26,54,.14)}
.hlist{display:grid;gap:12px}
.hcard{display:block;width:100%;text-align:left;position:relative;padding:14px 16px 14px 16px;border:3px solid #e2b85a;border-radius:18px;background:linear-gradient(165deg,#cc2340 0%,#a31832 52%,#7b1024 100%);color:#ffe9b8;cursor:pointer;font:inherit;box-shadow:0 6px 14px rgba(70,15,35,.35);overflow:hidden}
.hcard::before{content:"";position:absolute;inset:5px;border:1px solid rgba(255,233,184,.45);border-radius:12px;pointer-events:none}
.hcard .hk{position:absolute;right:14px;top:8px;font:400 2.1rem "Yuji Syuku",serif;color:#ffe9b8;opacity:.9}
.hcard b{display:block;font:400 1.25rem "Yuji Syuku","Shippori Mincho",serif;letter-spacing:.04em}
.hcard small{display:block;color:#f6cf8e;margin:1px 0 4px}
.hcard span.hd{display:block;font-size:.92rem;line-height:1.4;color:#fff3dc;padding-right:3rem}
.hcard:active{transform:scale(.985)}
.hpanel{background:rgba(255,250,240,.96);border:1px solid #a392c5;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(35,26,54,.14);color:#181225}
.hpanel p{margin:.4em 0}
.hhero{display:flex;align-items:center;gap:14px}
.hseal{flex:none;width:84px;height:84px;display:grid;place-items:center;border:3px solid #e2b85a;border-radius:16px;background:linear-gradient(165deg,#cc2340,#7b1024);color:#ffe9b8;font:400 2.3rem/1.05 "Yuji Syuku",serif;text-align:center;box-shadow:0 4px 10px rgba(70,15,35,.35);padding:4px;word-break:keep-all}
.hseal.long{font-size:1.5rem}
.htitle{font:400 1.7rem/1.1 "Yuji Syuku","Shippori Mincho",serif;margin:0;color:#4a2f23}
.hmeta{color:#513d7c;font-size:.92rem}
.hchip{display:inline-block;padding:3px 11px;border-radius:999px;border:1.5px solid #c49a3a;background:linear-gradient(#fffaf0,#edddbd);color:#4a2f23;font:700 .78rem "Zen Kaku Gothic New",sans-serif;letter-spacing:.03em;cursor:pointer}
button.hchip{font-family:inherit}
.hh{font:400 1.12rem "Yuji Syuku","Shippori Mincho",serif;color:#b2285b;margin:18px 0 6px;display:flex;align-items:center;gap:8px;letter-spacing:.04em}
.hh::before{content:"";width:6px;height:1.1em;background:#b2285b;border-radius:2px}
.hev{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed #c8b9a0}.hev:last-child{border:0}
.hev b{flex:none;width:7.4em;color:#7b1024;font-weight:700;font-size:.92rem}
.hbox{background:linear-gradient(#fbf5e6,#f2e6c9);border:1.5px solid #c49a3a;border-radius:12px;padding:10px 14px}
.hbox ul,.hpanel ul{margin:.3em 0;padding-left:1.15em}.hbox li,.hpanel li{margin:.25em 0}
.kw{display:inline;padding:0;margin:0;border:0;border-bottom:2px dotted #b2285b;background:none;color:inherit;font:inherit;cursor:pointer;border-radius:2px}
.kw:hover,.kw:focus-visible{background:rgba(178,40,91,.12);outline:none}
.hdet{border:1.5px solid #c49a3a;border-radius:12px;background:linear-gradient(#fffaf0,#f3e6c8);margin:8px 0;padding:0 14px}.hdet summary{cursor:pointer;padding:11px 0;font:400 1.02rem "Yuji Syuku","Shippori Mincho",serif;color:#7b1024;list-style:none}.hdet summary::-webkit-details-marker{display:none}.hdet summary::after{content:"＋";float:right;color:#b2285b}.hdet[open] summary::after{content:"－"}.hdet[open]{padding-bottom:6px}.hdet p{margin:.5em 0}
.hnav{display:flex;gap:10px;margin-top:6px}.hnav button{flex:1}
.hbtn{padding:10px 14px;border:2px solid #130f1e;border-radius:12px;background:linear-gradient(#fffaf0,#edddbd);color:#130f1e;font:700 .95rem "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.hback{justify-self:start}
.hgrp{font:400 1.05rem "Yuji Syuku",serif;color:#fff3dc;text-shadow:0 1px 3px rgba(35,26,54,.8);margin:8px 2px 0}
.hrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid #c49a3a;border-radius:14px;background:linear-gradient(#fffaf0,#f3e6c8);cursor:pointer;width:100%;text-align:left;font:inherit;color:#181225}
.hrow .rk{flex:none;width:4.6em;text-align:center;font:400 1.1rem/1.15 "Yuji Syuku",serif;color:#b2285b;word-break:break-all}
.hrow b{display:block}.hrow small{color:#513d7c}
.hnote{color:#fff3dc;text-shadow:0 1px 3px rgba(35,26,54,.8);font-size:.85rem;text-align:center;margin:4px 8px}
.vtag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:#2f254b;color:#ffe9b8;margin-left:6px;vertical-align:middle}
.qopt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 14px;border:2px solid #130f1e;border-radius:12px;background:linear-gradient(#fffaf0,#edddbd);color:#130f1e;font:600 .95rem "Zen Kaku Gothic New",sans-serif;cursor:pointer}
.qopt.ok{background:#bfe3b4;border-color:#2d6a2a}.qopt.ko{background:#f3b6b6;border-color:#9b1c1c}
.qq{font:400 1.08rem/1.5 "Yuji Syuku","Shippori Mincho",serif;color:#7b1024;margin:6px 0 10px}
.qbar{height:8px;border-radius:99px;background:#d9c9a5;overflow:hidden;margin:4px 0 10px}.qbar i{display:block;height:100%;background:#b2285b}
.qcard{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px;cursor:pointer;font:600 1.02rem/1.55 "Zen Kaku Gothic New",sans-serif}
.qcard .k{font:400 2rem "Yuji Syuku",serif;color:#b2285b;display:block;margin-bottom:6px}
</style></head>
<body class="onhome inapp kddock hist">
<div class="app">
<div class="status" id="status"></div>
<main class="hwrap" id="m"></main>
</div>
<nav id="kdDock" class="kdDock" aria-label="Menu principal">
<button type="button" class="kdd" data-k="hub" data-nav="out" aria-label="Retour au dojo"><span class="kdm" aria-hidden="true">道</span><span class="kdl">Dojo</span></button>
<button type="button" class="kdd on" data-k="multi" data-nav="#" aria-label="Époques"><span class="kdm" aria-hidden="true">史</span><span class="kdl">Époques</span></button>
<button type="button" class="kdd" data-k="fr" data-nav="#p" aria-label="Personnages"><span class="kdm" aria-hidden="true">人</span><span class="kdl">Personnages</span></button>
<button type="button" class="kdd" data-k="rev" data-nav="#r" aria-label="Réviser"><span class="kdm" aria-hidden="true">試</span><span class="kdl">Réviser</span></button>
<button type="button" class="kdd" data-k="cards" data-nav="#c" aria-label="Concepts"><span class="kdm" aria-hidden="true">語</span><span class="kdl">Concepts</span></button>
</nav>
<script>
(function(){
var D=[],FI=[],FM={},m=document.getElementById('m'),RX=null,TY={personnage:'Personnage',concept:'Concept','événement':'Événement'};
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
/* ---- mots cliquables : chaque alias de fiche, repéré dans les textes ---- */
function buildRx(){var lat=[],cjk=[],map={};FI.forEach(function(f){f.alias.forEach(function(a){if(!a||map[a])return;map[a]=f.id;(/^[\x00-ɏ’Ā-ſḀ-ỿ]/.test(a)&&/[A-Za-zÀ-ÿĀ-ſ]$/.test(a)?lat:cjk).push(a)})});
 function esc(a){return a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}function srt(x){return x.sort(function(a,b){return b.length-a.length}).map(esc).join('|')}
 var parts=[];if(lat.length)parts.push('(?<![\\p{L}\\p{M}])(?:'+srt(lat)+')(?![\\p{L}\\p{M}])');if(cjk.length)parts.push('(?:'+srt(cjk)+')');
 RX={re:new RegExp(parts.join('|'),'gu'),map:map}}
function lk(t,self,seen){t=String(t==null?'':t);seen=seen||{};var o='',i=0,mm;RX.re.lastIndex=0;
 while((mm=RX.re.exec(t))){var id=RX.map[mm[0]];if(!id||id===self||seen[id])continue;seen[id]=1;o+=e(t.slice(i,mm.index))+'<button type="button" class="kw" data-f="'+id+'">'+e(mm[0])+'</button>';i=mm.index+mm[0].length}
 return o+e(t.slice(i))}
function epName(id){var p=D.filter(function(x){return x.id===id||x.id.indexOf(id)===0})[0];return p}
function epOf(fid){var f=FM[fid],map={jomon:0,yayoi:1,kofun:2,asuka:3,nara:4,heian:5,kamakura:6,muromachi:7,sengoku:8,edo:9,meiji:10,taisho:11,showa:12,heisei:13};return map[f.epoque]==null?99:map[f.epoque]}
/* ---- vues ---- */
function setDock(k){[].forEach.call(document.querySelectorAll('#kdDock .kdd'),function(b){var on=b.getAttribute('data-nav')===k;b.classList.toggle('on',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')})}
function homeV(q){setDock('#');q=(q||'').toLowerCase();var h='<input id="q" class="hsearch" type="search" placeholder="Rechercher…" value="'+e(q)+'" aria-label="Recherche"><div class="hlist">';var n=0;
 D.forEach(function(p){if(q&&JSON.stringify(p).toLowerCase().indexOf(q)<0)return;n++;h+='<button class="hcard" data-e="'+p.id+'"><span class="hk">'+e(p.kanji.split('・')[0])+'</span><b>'+e(p.nom)+'</b><small>'+e(p.periode)+'</small><span class="hd">'+e(p.accroche)+'</span></button>'});
 if(q){FI.forEach(function(f){if((f.nom+' '+f.alias.join(' ')+' '+f.resume).toLowerCase().indexOf(q)>=0){n++;h+='<button class="hcard" data-f="'+f.id+'"><span class="hk">'+e(f.kanji.slice(0,2))+'</span><b>'+e(f.nom)+'</b><small>'+e(TY[f.type])+' · '+e(f.dates)+'</small><span class="hd">'+e(f.resume.slice(0,110))+'…</span></button>'}})}
 h+='</div>'+(n?'':'<div class="hpanel">Aucun résultat.</div>')+'<p class="hnote">Touche un mot en pointillé dans un texte pour ouvrir sa fiche. Contenu en cours d\'enrichissement.</p>';m.innerHTML=h;
 var qi=document.getElementById('q');qi.addEventListener('input',function(){var v=qi.value;homeV(v);var x=document.getElementById('q');x.focus();x.setSelectionRange(v.length,v.length)})}
function sec(t,b){return b?'<h3 class="hh">'+t+'</h3>'+b:''}
function epV(id){var i=D.findIndex(function(x){return x.id===id}),p=D[i];if(!p)return homeV();setDock('#');var s={};
 var h='<button class="hbtn hback" data-back="1">‹ Toutes les époques</button><div class="hpanel"><div class="hhero"><div class="hseal'+(p.kanji.length>3?' long':'')+'">'+e(p.kanji.split('・')[0])+'</div><div><h2 class="htitle">'+e(p.nom)+'</h2><div class="hmeta">'+e(p.periode)+'</div></div></div><p>'+lk(p.resume,null,s)+'</p>';
 h+=sec('Événements clés','<div>'+p.evenements.map(function(x){return'<div class="hev"><b>'+e(x[0])+'</b><span>'+lk(x[1],null,s)+'</span></div>'}).join('')+'</div>');
 if(p.chapitres)h+=sec('Cours détaillé',p.chapitres.map(function(c,k){return'<details class="hdet"'+(k===0?' open':'')+'><summary>'+e(c.t)+'</summary>'+c.p.map(function(x){return'<p>'+lk(x,null,s)+'</p>'}).join('')+'</details>'}).join(''));
 h+=sec('Société',p.societe?'<p>'+lk(p.societe,null,s)+'</p>':'')+sec('Culture',p.culture?'<p>'+lk(p.culture,null,s)+'</p>':'');
 h+=sec('Personnages',p.personnages.length?'<ul>'+p.personnages.map(function(x){return'<li><b>'+lk(x[0],null,s)+'</b> : '+lk(x[1],null,s)+'</li>'}).join('')+'</ul>':'');
 h+=sec('À retenir','<div class="hbox"><ul>'+p.retenir.map(function(x){return'<li>'+lk(x,null,s)+'</li>'}).join('')+'</ul></div>');
 h+=sec('Vocabulaire',p.mots.length?'<ul>'+p.mots.map(function(x){return'<li><b>'+lk(x[0],null,s)+'</b> <span class="hmeta">'+e(x[1])+'</span> : '+e(x[2])+'</li>'}).join('')+'</ul>':'');
 var rel=FI.filter(function(f){return f.epoque===p.id});if(rel.length)h+=sec('Fiches de cette époque','<div>'+rel.map(function(f){return'<button class="hchip" data-f="'+f.id+'">'+e(f.nom)+'</button> '}).join('')+'</div>');
 h+='</div><div class="hnav">'+(i>0?'<button class="hbtn" data-e="'+D[i-1].id+'">‹ '+e(D[i-1].nom)+'</button>':'')+(i<D.length-1?'<button class="hbtn" data-e="'+D[i+1].id+'">'+e(D[i+1].nom)+' ›</button>':'')+'</div>';m.innerHTML=h;scrollTo(0,0)}
function fV(id){var f=FM[id];if(!f)return homeV();setDock(f.type==='personnage'?'#p':'#c');var s={};s[id]=1;var ep=D.filter(function(x){return x.id===f.epoque})[0];
 var blob=JSON.stringify(D.map(function(x){return[x.id,x.nom,JSON.stringify(x)]})),ment=D.filter(function(x){var t=JSON.stringify(x);return f.alias.some(function(a){return t.indexOf(a)>=0})&&x.id!==f.epoque});
 var h='<button class="hbtn hback" data-back="1">‹ Retour</button><div class="hpanel"><div class="hhero"><div class="hseal'+(f.kanji.split('・')[0].length>3?' long':'')+'">'+e(f.kanji.split('・')[0].slice(0,4))+'</div><div><h2 class="htitle">'+e(f.nom)+'</h2><div class="hmeta">'+e(f.lecture)+'</div><div style="margin-top:6px"><span class="hchip" style="cursor:default">'+e(TY[f.type])+'</span> <span class="hchip" style="cursor:default">'+e(f.dates)+'</span></div></div></div>';
 h+='<p style="margin-top:12px">'+lk(f.resume,id,s)+'</p>'+sec('À savoir','<div class="hbox"><ul>'+f.points.map(function(x){return'<li>'+lk(x,id,s)+'</li>'}).join('')+'</ul></div>');
 if(f.voir.length)h+=sec('Voir aussi','<div>'+f.voir.map(function(v){return FM[v]?'<button class="hchip" data-f="'+v+'">'+e(FM[v].nom)+'</button> ':''}).join('')+'</div>');
 var eps=[];if(ep)eps.push(ep);ment.forEach(function(x){if(eps.indexOf(x)<0)eps.push(x)});
 if(eps.length)h+=sec('Dans le cours d\'histoire','<div>'+eps.map(function(x){return'<button class="hchip" data-e="'+x.id+'">'+e(x.nom)+'</button> '}).join('')+'</div>');
 h+='</div>';m.innerHTML=h;scrollTo(0,0)}
function listV(type,q){var isP=type==='personnage';setDock(isP?'#p':'#c');q=(q||'').toLowerCase();
 var arr=FI.filter(function(f){return isP?f.type==='personnage':f.type!=='personnage'}).filter(function(f){return !q||(f.nom+' '+f.alias.join(' ')+' '+f.resume+' '+f.dates).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return epOf(a.id)-epOf(b.id)});
 var h='<input id="q" class="hsearch" type="search" placeholder="'+(isP?'Chercher un personnage…':'Chercher un concept, un événement…')+'" value="'+e(q)+'" aria-label="Recherche"><div class="hlist">',cur='';
 arr.forEach(function(f){var ep=D.filter(function(x){return x.id===f.epoque})[0];if(ep&&ep.id!==cur){cur=ep.id;h+='<div class="hgrp">'+e(ep.nom)+' · '+e(ep.periode)+'</div>'}
  h+='<button class="hrow" data-f="'+f.id+'"><span class="rk">'+e(f.kanji.split('・')[0].slice(0,4))+'</span><span><b>'+e(f.nom)+'</b><small>'+e(f.dates)+(f.type==='événement'?' · événement':'')+'</small></span></button>'});
 h+='</div>'+(arr.length?'':'<div class="hpanel">Aucun résultat.</div>');m.innerHTML=h;
 var qi=document.getElementById('q');qi.addEventListener('input',function(){var v=qi.value;listV(type,v);var x=document.getElementById('q');x.focus();x.setSelectionRange(v.length,v.length)})}

var QS=null;
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(pool,ans,n){var o=shuf(pool.filter(function(x,i,ar){return x!==ans&&ar.indexOf(x)===i})).slice(0,n);return shuf(o.concat([ans]))}
function mask(f){var t=f.resume;[f.nom].concat(f.alias||[]).filter(function(a){return a&&a.length>2}).sort(function(a,b){return b.length-a.length}).forEach(function(a){t=t.split(a).join('…')});return t}
function cardsFor(scope){var eps=scope==='all'?D:D.filter(function(x){return x.id===scope}),C=[];
 eps.forEach(function(p){(p.mots||[]).forEach(function(w){C.push({t:'mot',ep:p.id,q:'Que signifie « '+w[0]+' »'+(w[1]?' ('+w[1]+')':'')+' ?',a:w[2],k:w[1]||w[0]})});
  (p.retenir||[]).forEach(function(r){C.push({t:'ret',ep:p.id,q:'À retenir · '+p.nom,a:r,k:p.kanji})});
  (p.evenements||[]).forEach(function(v){C.push({t:'date',ep:p.id,q:v[1],a:v[0],k:p.kanji})})});
 FI.filter(function(f){return scope==='all'||f.epoque===scope}).forEach(function(f){C.push({t:'fic',ep:f.epoque,f:f,q:mask(f),a:f.nom,k:f.kanji.split('・')[0].slice(0,4)})});
 return C}
function mkQ(c,all){var pool=all.filter(function(x){return x.t===c.t&&x!==c}).map(function(x){return x.a});
 if(c.t==='mot')return{q:c.q,a:c.a,o:pick(pool,c.a,3)};
 if(c.t==='date')return{q:'Quand ? '+c.q,a:c.a,o:pick(pool.filter(function(d){return d.length<40}),c.a,3)};
 if(c.t==='fic')return{q:'De qui ou de quoi s\'agit-il ? '+c.q,a:c.a,o:pick(all.filter(function(x){return x.t==='fic'&&x.f.type===c.f.type&&x!==c}).map(function(x){return x.a}),c.a,3)};
 return null}
function revV(){setDock('#r');var h='<div class="hpanel"><h3 class="hh" style="margin-top:0">Réviser</h3><p>Choisis une époque (ou tout), puis un mode.</p><select id="rs" class="hsearch" aria-label="Époque"><option value="all">Toutes les époques</option>'+D.map(function(p){return'<option value="'+p.id+'">'+e(p.nom)+' · '+e(p.periode)+'</option>'}).join('')+'</select>';
 h+='<button class="hbtn" style="width:100%;margin-top:10px" data-rv="qcm">QCM · 10 questions</button><button class="hbtn" style="width:100%;margin-top:8px" data-rv="cartes">Cartes de révision</button>';
 var b='';try{b=localStorage.getItem('hist_best')||''}catch(x){}
 if(b)h+='<p class="hnote" style="color:#513d7c;text-shadow:none">Meilleur score QCM : '+e(b)+'/10</p>';
 m.innerHTML=h+'</div>';scrollTo(0,0)}
function startQ(scope){var all=cardsFor(scope),qs=shuf(all).map(function(c){return mkQ(c,all)}).filter(function(x){return x&&x.o.length>=3}).slice(0,10);
 if(qs.length<3){m.innerHTML='<div class="hpanel">Pas assez de contenu pour cette époque. <button class="hbtn" data-rv="menu">Retour</button></div>';return}
 QS={qs:qs,i:0,s:0,scope:scope};showQ()}
function showQ(){var S=QS,q=S.qs[S.i];if(!q)return endQ();
 m.innerHTML='<div class="hpanel"><div class="qbar"><i style="width:'+(S.i/S.qs.length*100)+'%"></i></div><small>Question '+(S.i+1)+'/'+S.qs.length+'</small><div class="qq">'+e(q.q)+'</div>'+q.o.map(function(o,k){return'<button class="qopt" data-o="'+k+'">'+e(o)+'</button>'}).join('')+'</div>'}
function endQ(){var S=QS;try{var b=+localStorage.getItem('hist_best')||0;if(S.scope==='all'&&S.s>b)localStorage.setItem('hist_best',S.s)}catch(x){}
 m.innerHTML='<div class="hpanel"><h3 class="hh" style="margin-top:0">Score : '+S.s+'/'+S.qs.length+'</h3><p>'+(S.s>=S.qs.length*.8?'Excellent !':S.s>=S.qs.length*.5?'Bien, continue.':'À retravailler : repasse par les cours.')+'</p><button class="hbtn" style="width:100%" data-rv="qcm" data-sc="'+S.scope+'">Rejouer</button><button class="hbtn" style="width:100%;margin-top:8px" data-rv="menu">Menu</button></div>'}
function startC(scope){var all=shuf(cardsFor(scope));QS={cs:all,i:0,flip:false};showC()}
